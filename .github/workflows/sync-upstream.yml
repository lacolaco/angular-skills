name: sync-upstream

# angular/angular の Update Guide ソース (adev/src/app/features/update) を追跡し、
# skills/angular-update-guide/ を再生成する。中間ファイルは持たない。
# render は決定論的なので、差分が出た場合は上流が変わったことを意味する
# (peter-evans/create-pull-request は差分なしのとき何もしない)。

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # angular/angular is a large monorepo — the submodule is fetched with
      # partial clone (--filter=blob:none), depth 1, and sparse-checkout
      # limited to the one directory main.ts reads. actions/checkout's
      # built-in submodule support doesn't carry sparse-checkout config
      # (it isn't tracked in .gitmodules), so the submodule is cloned by
      # hand here instead, advancing the pointer to the latest upstream
      # commit each run.
      - name: Fetch upstream submodule (shallow, partial, sparse)
        run: |
          rm -rf upstream/angular
          url=$(git config -f .gitmodules submodule.upstream/angular.url)
          git clone --filter=blob:none --depth 1 --no-checkout --sparse "$url" upstream/angular
          git -C upstream/angular sparse-checkout set adev/src/app/features/update
          git -C upstream/angular checkout main
          git submodule absorbgitdirs upstream/angular

      - name: Regenerate skill data
        id: regen
        run: |
          pnpm run build:angular-update-guide
          # The submodule now points at upstream HEAD, which moves whenever
          # angular/angular does — far more often than the Update Guide data
          # changes. Advancing the pointer on its own would open a pull
          # request most days with nothing to review, so the pointer only
          # travels when regeneration actually produced something different.
          if git diff --quiet -- skills; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm exec tsc --noEmit

      - run: pnpm test

      - name: Read upstream source
        if: steps.regen.outputs.changed == 'true'
        id: source
        run: |
          SHA=$(git -C upstream/angular rev-parse HEAD)
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.regen.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync angular-update-guide from upstream'
          title: 'chore: sync angular-update-guide from upstream'
          body: |
            Advanced the `upstream/angular` submodule to the latest commit and regenerated `skills/angular-update-guide/` from it.

            Upstream commit: [`${{ steps.source.outputs.commit_sha }}`](https://github.com/angular/angular/commit/${{ steps.source.outputs.commit_sha }})
          branch: chore/sync-upstream
          delete-branch: true
          add-paths: |
            skills/
            upstream/
