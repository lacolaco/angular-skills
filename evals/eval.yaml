# skillgrade evaluation for the angular-update-guide skill.
#
#   cd evals && skillgrade --ci
#
# Each task hands the agent a project pinned to one Angular major and asks for
# the breaking changes of the single step to the next major. Two things are
# measured, both from the answer alone: whether every item of that step is
# there, and whether items of the adjacent steps leaked in. The second is the
# point of the skill's one-step-one-file shape — an agent that dumps all
# sixteen reference files would satisfy the first check on its own.
#
# This directory sits outside `skills/` on purpose, for two reasons. `npx
# skills add` copies a skill directory whole, so anything kept next to
# SKILL.md ships to every consumer. And the runner copies this directory into
# the workspace root, so a harness living inside the skill would also put
# `references/` there — letting the agent read it without going through skill
# discovery, which is the thing under test.

version: "1"

# The skill under test, relative to this file.
skill: ../skills/angular-update-guide

defaults:
  agent: claude
  # `local`, not `docker`: the claude adapter shells out to `claude -p`, which
  # authenticates through the Claude Code CLI on the host. A container has no
  # credentials. The local provider copies this directory into the workspace
  # root and injects the skill under `.claude/skills/`, which is where
  # check.mjs looks for `references/`.
  provider: local
  trials: 15
  timeout: 600
  threshold: 0.9

tasks:
  - name: v21-to-v22
    instruction: instruction.md
    workspace:
      - src: fixtures/v21/package.json.fixture
        dest: package.json
    graders:
      - type: deterministic
        run: node graders/check.mjs v21-to-v22 v20-to-v21

  - name: v20-to-v21
    instruction: instruction.md
    workspace:
      - src: fixtures/v20/package.json.fixture
        dest: package.json
    graders:
      - type: deterministic
        run: node graders/check.mjs v20-to-v21 v19-to-v20 v21-to-v22

  - name: v8-to-v9
    instruction: instruction.md
    workspace:
      - src: fixtures/v8/package.json.fixture
        dest: package.json
    graders:
      - type: deterministic
        run: node graders/check.mjs v8-to-v9 v7-to-v8 v9-to-v10
